<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>InstaGram - Edit Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg-secondary: #111820;
    --bg-card: #151d28;
    --bg-elevated: #1a2332;
    --fg: #e8edf3;
    --fg-muted: #6b7d94;
    --fg-dim: #3d4f63;
    --accent: #00d4aa;
    --accent-glow: rgba(0, 212, 170, 0.25);
    --accent-dark: #00a885;
    --danger: #ff4757;
    --warning: #ffa502;
    --success: #2ed573;
    --border: rgba(255,255,255,0.06);
    --glass: rgba(17, 24, 32, 0.85);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-full: 9999px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --shadow-accent: 0 4px 20px rgba(0, 212, 170, 0.3);
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app-shell {
    max-width: 430px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  .bg-atmosphere {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    max-width: 430px;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-atmosphere .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .bg-atmosphere .orb:nth-child(1) {
    width: 300px; height: 300px;
    background: var(--accent);
    top: -80px; right: -60px;
  }
  .bg-atmosphere .orb:nth-child(2) {
    width: 200px; height: 200px;
    background: #ff6b6b;
    bottom: 100px; left: -40px;
    animation-delay: -4s;
    opacity: 0.08;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(20px, -30px) scale(1.1); }
    66% { transform: translate(-15px, 20px) scale(0.95); }
  }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 1;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page::-webkit-scrollbar { display: none; }
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .top-bar .back-btn {
    background: none; border: none;
    color: var(--fg); font-size: 20px;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    font-size: 16px;
  }
  .top-bar .back-btn:hover { color: var(--accent); }
  .top-bar .save-btn {
    padding: 8px 20px;
    background: var(--accent);
    color: #000;
    font-weight: 700;
    font-size: 14px;
    border-radius: var(--radius-full);
    cursor: pointer;
    border: none;
    font-family: 'Outfit', sans-serif;
    transition: var(--transition);
  }
  .top-bar .save-btn:hover {
    box-shadow: var(--shadow-accent);
  }
  .top-bar .save-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
  }
  .avatar-edit-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 18px 20px;
  }
  .avatar-edit-wrap {
    position: relative;
    cursor: pointer;
    margin-bottom: 12px;
  }
  .avatar-edit-wrap img {
    width: 100px; height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
  }
  .avatar-edit-wrap .change-avatar-btn {
    position: absolute;
    bottom: 0; right: 0;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    border: 3px solid var(--bg);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: var(--transition);
  }
  .avatar-edit-wrap .change-avatar-btn:hover {
    transform: scale(1.1);
  }
  .avatar-edit-wrap .change-avatar-btn input {
    display: none;
  }
  .avatar-edit-section .avatar-hint {
    font-size: 12px;
    color: var(--fg-muted);
  }
  .edit-form {
    padding: 0 18px 30px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .form-input {
    width: 100%;
    padding: 12px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--fg);
    font-size: 14px;
    font-family: 'Outfit', sans-serif;
    outline: none;
    transition: var(--transition);
    resize: none;
  }
  .form-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .form-input::placeholder { color: var(--fg-dim); }
  .char-count {
    text-align: right;
    font-size: 11px;
    color: var(--fg-dim);
    margin-top: 4px;
  }
  .char-count.warn { color: var(--warning); }
  .char-count.over { color: var(--danger); }
  .form-hint {
    font-size: 11px;
    color: var(--fg-dim);
    margin-top: 6px;
  }
  .upload-progress {
    display: none;
    margin: 0 18px 16px;
  }
  .upload-progress .progress-bar-bg {
    width: 100%;
    height: 6px;
    background: var(--bg-card);
    border-radius: 3px;
    overflow: hidden;
  }
  .upload-progress .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    width: 0%;
    transition: width 0.3s ease;
  }
  .upload-progress .progress-text {
    font-size: 12px;
    color: var(--fg-muted);
    margin-top: 6px;
    text-align: center;
  }
  .toast-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    max-width: 400px;
    width: calc(100% - 36px);
  }
  .toast {
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    animation: toastIn 0.35s ease, toastOut 0.35s ease 2.5s forwards;
    box-shadow: var(--shadow);
  }
  .toast.success {
    background: #0d2818;
    border: 1px solid rgba(46, 213, 115, 0.3);
    color: var(--success);
  }
  .toast.error {
    background: #2d0f13;
    border: 1px solid rgba(255, 71, 87, 0.3);
    color: var(--danger);
  }
  .toast.info {
    background: #0d1f2d;
    border: 1px solid rgba(0, 212, 170, 0.3);
    color: var(--accent);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-20px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
  @media (min-width: 431px) {
    .app-shell {
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<div class="app-shell" id="app">
  <div class="bg-atmosphere">
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="page active" id="page-edit-profile">
    <div class="top-bar">
      <button class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i>
        Back
      </button>
      <button class="save-btn" id="saveBtn" onclick="saveProfile()">Save</button>
    </div>

    <div class="avatar-edit-section">
      <div class="avatar-edit-wrap" onclick="document.getElementById('avatarInput').click()">
        <img id="avatarPreview" src="https://picsum.photos/seed/default/200/200.jpg" alt="Avatar">
        <div class="change-avatar-btn">
          <i class="fas fa-camera"></i>
          <input type="file" id="avatarInput" accept="image/*">
        </div>
      </div>
      <div class="avatar-hint">Tap to change profile photo</div>
    </div>

    <div class="upload-progress" id="avatarProgress">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="avatarProgressFill"></div>
      </div>
      <div class="progress-text" id="avatarProgressText">Uploading... 0%</div>
    </div>

    <div class="edit-form">
      <div class="form-group">
        <label for="editUsername">Username</label>
        <input class="form-input" id="editUsername" type="text" placeholder="Enter username" maxlength="30">
        <div class="form-hint">Unique name for your profile</div>
      </div>

      <div class="form-group">
        <label for="editDisplayName">Display Name</label>
        <input class="form-input" id="editDisplayName" type="text" placeholder="Enter display name" maxlength="50">
      </div>

      <div class="form-group">
        <label for="editBio">Bio</label>
        <textarea class="form-input" id="editBio" rows="3" placeholder="Tell us about yourself..." maxlength="150"></textarea>
        <div class="char-count" id="bioCharCount">0 / 150</div>
      </div>

      <div class="form-group">
        <label for="editLink">Website / Profile Link</label>
        <input class="form-input" id="editLink" type="text" placeholder="https://yoursite.com">
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmQxNPKANzO8hEng5pdpAR3t7DJtwkG7U",
  authDomain: "aibmodel.firebaseapp.com",
  databaseURL: "https://aibmodel-default-rtdb.firebaseio.com",
  projectId: "aibmodel",
  storageBucket: "aibmodel.firebasestorage.app",
  messagingSenderId: "572663832515",
  appId: "1:572663832515:web:3fea2dac685b9b5f646776"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUserId = null;
let currentUserData = null;
let newAvatarUrl = null;

const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dxdcjxigq/image/upload';
const CLOUDINARY_UPLOAD_PRESET = 'Coinxdrop';

function initUser() {
  return new Promise((resolve) => {
    const stored = localStorage.getItem('instaUserId');
    if (stored) {
      currentUserId = stored;
      db.ref('users/' + currentUserId).once('value', (snap) => {
        if (snap.exists()) {
          currentUserData = snap.val();
          resolve();
        } else {
          window.location.href = 'home.html';
        }
      });
    } else {
      window.location.href = 'home.html';
    }
  });
}

function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  var icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
  t.innerHTML = '<i class="fas ' + icon + '"></i>' + msg;
  c.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
}

function goBack() {
  window.location.href = 'profile.html';
}

function populateForm() {
  if (currentUserData.avatar) {
    document.getElementById('avatarPreview').src = currentUserData.avatar;
  }
  document.getElementById('editUsername').value = currentUserData.username || '';
  document.getElementById('editDisplayName').value = currentUserData.displayName || '';
  document.getElementById('editBio').value = currentUserData.bio || '';
  document.getElementById('editLink').value = currentUserData.profileLink || '';
  updateBioCount();
}

function updateBioCount() {
  var len = document.getElementById('editBio').value.length;
  var cc = document.getElementById('bioCharCount');
  cc.textContent = len + ' / 150';
  cc.className = 'char-count' + (len > 130 ? (len > 150 ? ' over' : ' warn') : '');
}

document.getElementById('editBio').addEventListener('input', updateBioCount);

document.getElementById('avatarInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('Please select an image file', 'error');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) {
    document.getElementById('avatarPreview').src = ev.target.result;
    newAvatarUrl = null;

    document.getElementById('avatarProgress').style.display = 'block';
    document.getElementById('avatarProgressFill').style.width = '0%';
    document.getElementById('avatarProgressText').textContent = 'Uploading... 0%';

    var formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', CLOUDINARY_URL, true);

    xhr.upload.addEventListener('progress', function(e) {
      if (e.lengthComputable) {
        var pct = Math.round((e.loaded / e.total) * 100);
        document.getElementById('avatarProgressFill').style.width = pct + '%';
        document.getElementById('avatarProgressText').textContent = 'Uploading... ' + pct + '%';
      }
    });

    xhr.onload = function() {
      if (xhr.status === 200) {
        var res = JSON.parse(xhr.responseText);
        newAvatarUrl = res.secure_url;
        document.getElementById('avatarProgressText').textContent = 'Upload complete';
        setTimeout(function() {
          document.getElementById('avatarProgress').style.display = 'none';
        }, 1000);
      } else {
        showToast('Avatar upload failed', 'error');
        document.getElementById('avatarProgress').style.display = 'none';
      }
    };
    xhr.onerror = function() {
      showToast('Network error during upload', 'error');
      document.getElementById('avatarProgress').style.display = 'none';
    };
    xhr.send(formData);
  };
  reader.readAsDataURL(file);
});

function saveProfile() {
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  var username = document.getElementById('editUsername').value.trim();
  var displayName = document.getElementById('editDisplayName').value.trim();
  var bio = document.getElementById('editBio').value.trim();
  var profileLink = document.getElementById('editLink').value.trim();

  if (!username) {
    showToast('Username is required', 'error');
    btn.disabled = false;
    btn.textContent = 'Save';
    return;
  }

  var updates = {
    username: username,
    displayName: displayName || username,
    bio: bio,
    profileLink: profileLink
  };

  if (newAvatarUrl) {
    updates.avatar = newAvatarUrl;
  }

  db.ref('users/' + currentUserId).update(updates).then(function() {
    showToast('Profile updated successfully', 'success');
    setTimeout(function() {
      window.location.href = 'profile.html';
    }, 800);
  }).catch(function(err) {
    showToast('Failed to update: ' + err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Save';
  });
}

initUser().then(function() {
  populateForm();
});
</script>
</body>
</html>
