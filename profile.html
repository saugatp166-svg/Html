<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>InstaGram - Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg-secondary: #111820;
    --bg-card: #151d28;
    --bg-elevated: #1a2332;
    --fg: #e8edf3;
    --fg-muted: #6b7d94;
    --fg-dim: #3d4f63;
    --accent: #00d4aa;
    --accent-glow: rgba(0, 212, 170, 0.25);
    --accent-dark: #00a885;
    --danger: #ff4757;
    --warning: #ffa502;
    --success: #2ed573;
    --border: rgba(255,255,255,0.06);
    --glass: rgba(17, 24, 32, 0.85);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-full: 9999px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --shadow-accent: 0 4px 20px rgba(0, 212, 170, 0.3);
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app-shell {
    max-width: 430px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  .bg-atmosphere {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    max-width: 430px;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-atmosphere .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .bg-atmosphere .orb:nth-child(1) {
    width: 300px; height: 300px;
    background: var(--accent);
    top: -80px; right: -60px;
  }
  .bg-atmosphere .orb:nth-child(2) {
    width: 200px; height: 200px;
    background: #ff6b6b;
    bottom: 100px; left: -40px;
    animation-delay: -4s;
    opacity: 0.08;
  }
  .bg-atmosphere .orb:nth-child(3) {
    width: 250px; height: 250px;
    background: #ffd93d;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: -8s;
    opacity: 0.05;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(20px, -30px) scale(1.1); }
    66% { transform: translate(-15px, 20px) scale(0.95); }
  }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 64px;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 1;
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page::-webkit-scrollbar { display: none; }
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .top-bar .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .top-bar .actions { display: flex; gap: 16px; }
  .top-bar .actions button {
    background: none; border: none;
    color: var(--fg); font-size: 20px;
    cursor: pointer;
    transition: var(--transition);
  }
  .top-bar .actions button:hover { color: var(--accent); }
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--fg-dim);
    font-size: 10px;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    transition: var(--transition);
    position: relative;
    text-decoration: none;
  }
  .nav-item i { font-size: 20px; transition: var(--transition); }
  .nav-item.active { color: var(--accent); }
  .nav-item.active i { transform: scale(1.1); }
  .nav-item::before {
    content: '';
    position: absolute;
    top: -1px; left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 24px; height: 2px;
    border-radius: 2px;
    background: var(--accent);
    transition: var(--transition);
  }
  .nav-item.active::before { transform: translateX(-50%) scaleX(1); }
  .nav-item.upload-btn {
    position: relative;
    top: -10px;
  }
  .nav-item.upload-btn .upload-icon-wrap {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-accent);
    transition: var(--transition);
  }
  .nav-item.upload-btn:hover .upload-icon-wrap {
    transform: scale(1.08);
    box-shadow: 0 6px 28px rgba(0, 212, 170, 0.45);
  }
  .nav-item.upload-btn i { color: #fff; font-size: 20px; }
  .nav-item.upload-btn span { display: none; }
  .profile-header {
    padding: 20px 18px;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .profile-pic-wrap {
    position: relative;
    flex-shrink: 0;
  }
  .profile-pic-wrap img {
    width: 80px; height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--accent);
  }
  .profile-pic-wrap .online-dot {
    position: absolute;
    bottom: 2px; right: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--success);
    border: 3px solid var(--bg);
  }
  .profile-stats {
    display: flex;
    gap: 20px;
    flex: 1;
    justify-content: center;
  }
  .profile-stat {
    text-align: center;
    cursor: pointer;
  }
  .profile-stat .num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
  }
  .profile-stat .label {
    font-size: 11px;
    color: var(--fg-muted);
  }
  .profile-info {
    padding: 0 18px 16px;
  }
  .profile-info .display-name {
    font-size: 16px;
    font-weight: 700;
  }
  .profile-info .bio {
    font-size: 13px;
    color: var(--fg-muted);
    margin-top: 4px;
    line-height: 1.5;
  }
  .profile-info .profile-link {
    font-size: 13px;
    color: var(--accent);
    margin-top: 4px;
  }
  .profile-buttons {
    display: flex;
    gap: 8px;
    padding: 0 18px 16px;
  }
  .profile-buttons button {
    flex: 1;
    padding: 10px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Outfit', sans-serif;
    transition: var(--transition);
  }
  .btn-edit-profile {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--fg);
  }
  .btn-edit-profile:hover { border-color: var(--accent); }
  .btn-share-profile {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--fg);
  }
  .btn-share-profile:hover { border-color: var(--accent); }
  .btn-settings {
    width: 38px !important;
    flex: none !important;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .profile-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .profile-tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    background: none;
    border: none;
    color: var(--fg-dim);
    font-size: 20px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
  }
  .profile-tab.active { color: var(--fg); }
  .profile-tab::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 40px; height: 2px;
    background: var(--fg);
    border-radius: 2px;
    transition: var(--transition);
  }
  .profile-tab.active::after { transform: translateX(-50%) scaleX(1); }
  .profile-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    padding: 2px;
  }
  .profile-grid-item {
    aspect-ratio: 1;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    background: var(--bg-secondary);
  }
  .profile-grid-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .profile-grid-item:hover img { transform: scale(1.05); }
  .profile-grid-item .grid-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    opacity: 0;
    transition: var(--transition);
  }
  .profile-grid-item:hover .grid-overlay { opacity: 1; }
  .grid-overlay span {
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .settings-list { padding: 0 18px 20px; }
  .settings-group-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 16px 0 8px;
  }
  .setting-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: var(--transition);
  }
  .setting-item:last-child { border-bottom: none; }
  .setting-item:hover { opacity: 0.8; }
  .setting-item i {
    width: 24px;
    text-align: center;
    color: var(--fg-muted);
    font-size: 16px;
  }
  .setting-item .setting-label { flex: 1; font-size: 14px; }
  .setting-item .setting-value {
    font-size: 13px;
    color: var(--fg-muted);
  }
  .setting-item .setting-arrow {
    color: var(--fg-dim);
    font-size: 12px;
  }
  .setting-item.danger { color: var(--danger); }
  .setting-item.danger i { color: var(--danger); }
  .toast-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    max-width: 400px;
    width: calc(100% - 36px);
  }
  .toast {
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    animation: toastIn 0.35s ease, toastOut 0.35s ease 2.5s forwards;
    box-shadow: var(--shadow);
  }
  .toast.success {
    background: #0d2818;
    border: 1px solid rgba(46, 213, 115, 0.3);
    color: var(--success);
  }
  .toast.error {
    background: #2d0f13;
    border: 1px solid rgba(255, 71, 87, 0.3);
    color: var(--danger);
  }
  .toast.info {
    background: #0d1f2d;
    border: 1px solid rgba(0, 212, 170, 0.3);
    color: var(--accent);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-20px); }
  }
  .fade-up {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.5s ease forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius-sm);
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--fg-dim);
  }
  .empty-state i { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
  @media (min-width: 431px) {
    .app-shell {
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<div class="app-shell" id="app">
  <div class="bg-atmosphere">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="page active" id="page-profile">
    <div class="top-bar">
      <div class="logo">
        <i class="fas fa-lock" style="font-size:14px;color:var(--fg-muted)"></i>
        <span id="topUsername">...</span>
      </div>
      <div class="actions">
        <button aria-label="Menu" id="profileMenuBtn">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </div>

    <div class="profile-header fade-up">
      <div class="profile-pic-wrap">
        <img id="profileAvatar" src="https://picsum.photos/seed/default/200/200.jpg" alt="Profile">
        <div class="online-dot"></div>
      </div>
      <div class="profile-stats">
        <div class="profile-stat">
          <div class="num" id="postCount">0</div>
          <div class="label">Posts</div>
        </div>
        <div class="profile-stat">
          <div class="num" id="followerCount">0</div>
          <div class="label">Followers</div>
        </div>
        <div class="profile-stat">
          <div class="num" id="followingCount">0</div>
          <div class="label">Following</div>
        </div>
      </div>
    </div>

    <div class="profile-info fade-up">
      <div class="display-name" id="displayName">Loading...</div>
      <div class="bio" id="bioText"></div>
      <div class="profile-link" id="profileLink" style="display:none"></div>
    </div>

    <div class="profile-buttons fade-up">
      <button class="btn-edit-profile" onclick="window.location.href='edit-profile.html'">Edit Profile</button>
      <button class="btn-share-profile" onclick="shareProfile()">Share Profile</button>
      <button class="btn-settings btn-edit-profile" onclick="toggleSettings()" aria-label="Settings">
        <i class="fas fa-cog"></i>
      </button>
    </div>

    <div id="profileContent">
      <div class="profile-tabs">
        <button class="profile-tab active" data-tab="grid" aria-label="Posts">
          <i class="fas fa-th"></i>
        </button>
        <button class="profile-tab" data-tab="reels" aria-label="Reels">
          <i class="fas fa-play-circle"></i>
        </button>
        <button class="profile-tab" data-tab="tagged" aria-label="Tagged">
          <i class="fas fa-user-tag"></i>
        </button>
      </div>
      <div class="profile-grid" id="profileGrid"></div>
    </div>

    <div id="settingsContent" style="display:none">
      <div class="settings-list">
        <div class="settings-group-title">Account</div>
        <div class="setting-item" onclick="showToast('Opening account settings...', 'info')">
          <i class="fas fa-user-circle"></i>
          <span class="setting-label">Account Settings</span>
          <i class="fas fa-chevron-right setting-arrow"></i>
        </div>
        <div class="setting-item" onclick="showToast('Opening security...', 'info')">
          <i class="fas fa-shield-alt"></i>
          <span class="setting-label">Security</span>
          <i class="fas fa-chevron-right setting-arrow"></i>
        </div>
        <div class="setting-item" onclick="showToast('Opening privacy...', 'info')">
          <i class="fas fa-lock"></i>
          <span class="setting-label">Privacy</span>
          <i class="fas fa-chevron-right setting-arrow"></i>
        </div>

        <div class="settings-group-title">Preferences</div>
        <div class="setting-item" onclick="showToast('Opening notifications...', 'info')">
          <i class="fas fa-bell"></i>
          <span class="setting-label">Notifications</span>
          <span class="setting-value">On</span>
          <i class="fas fa-chevron-right setting-arrow"></i>
        </div>
        <div class="setting-item" onclick="showToast('Opening theme...', 'info')">
          <i class="fas fa-palette"></i>
          <span class="setting-label">Appearance</span>
          <span class="setting-value">Dark</span>
          <i class="fas fa-chevron-right setting-arrow"></i>
        </div>
        <div class="setting-item" onclick="showToast('Opening language...', 'info')">
          <i class="fas fa-globe"></i>
          <span class="setting-label">Language</span>
          <span class="setting-value">English</span>
          <i class="fas fa-chevron-right setting-arrow"></i>
        </div>

        <div class="settings-group-title">Support</div>
        <div class="setting-item" onclick="showToast('Opening help center...', 'info')">
          <i class="fas fa-question-circle"></i>
          <span class="setting-label">Help Center</span>
          <i class="fas fa-chevron-right setting-arrow"></i>
        </div>
        <div class="setting-item" onclick="showToast('App version 2.4.1', 'info')">
          <i class="fas fa-info-circle"></i>
          <span class="setting-label">About</span>
          <span class="setting-value">v2.4.1</span>
          <i class="fas fa-chevron-right setting-arrow"></i>
        </div>

        <div class="settings-group-title">Session</div>
        <div class="setting-item danger" onclick="logOut()">
          <i class="fas fa-sign-out-alt"></i>
          <span class="setting-label">Log Out</span>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-item" href="home.html" aria-label="Home">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a class="nav-item" href="wallet.html" aria-label="Wallet">
      <i class="fas fa-wallet"></i>
      <span>Wallet</span>
    </a>
    <a class="nav-item upload-btn" href="upload.html" aria-label="Upload">
      <div class="upload-icon-wrap">
        <i class="fas fa-plus"></i>
      </div>
      <span>Upload</span>
    </a>
    <a class="nav-item" href="referral.html" aria-label="Referral">
      <i class="fas fa-gift"></i>
      <span>Invite</span>
    </a>
    <a class="nav-item active" href="profile.html" aria-label="Profile">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </a>
  </nav>

  <div class="toast-container" id="toastContainer"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmQxNPKANzO8hEng5pdpAR3t7DJtwkG7U",
  authDomain: "aibmodel.firebaseapp.com",
  databaseURL: "https://aibmodel-default-rtdb.firebaseio.com",
  projectId: "aibmodel",
  storageBucket: "aibmodel.firebasestorage.app",
  messagingSenderId: "572663832515",
  appId: "1:572663832515:web:3fea2dac685b9b5f646776"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUserId = null;
let currentUserData = null;

function initUser() {
  return new Promise((resolve) => {
    const stored = localStorage.getItem('instaUserId');
    if (stored) {
      currentUserId = stored;
      db.ref('users/' + currentUserId).once('value', (snap) => {
        if (snap.exists()) {
          currentUserData = snap.val();
          resolve();
        } else {
          window.location.href = 'home.html';
        }
      });
    } else {
      window.location.href = 'home.html';
    }
  });
}

function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  var icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
  t.innerHTML = '<i class="fas ' + icon + '"></i>' + msg;
  c.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
}

function toggleSettings() {
  var pc = document.getElementById('profileContent');
  var sc = document.getElementById('settingsContent');
  if (sc.style.display === 'none') {
    sc.style.display = 'block';
    pc.style.display = 'none';
  } else {
    sc.style.display = 'none';
    pc.style.display = 'block';
  }
}

function shareProfile() {
  var text = 'Check out my profile on InstaGram - ' + (currentUserData.username || 'user');
  if (navigator.share) {
    navigator.share({ title: 'InstaGram Profile', text: text, url: window.location.href });
  } else {
    navigator.clipboard.writeText(text + ' ' + window.location.href).then(function() {
      showToast('Profile link copied', 'success');
    });
  }
}

function logOut() {
  localStorage.removeItem('instaUserId');
  showToast('Logged out successfully', 'error');
  setTimeout(function() {
    window.location.href = 'home.html';
  }, 1000);
}

function loadProfileData() {
  document.getElementById('topUsername').textContent = currentUserData.username || 'user';
  document.getElementById('displayName').textContent = currentUserData.displayName || 'User';

  if (currentUserData.avatar) {
    document.getElementById('profileAvatar').src = currentUserData.avatar;
  }

  if (currentUserData.bio) {
    document.getElementById('bioText').textContent = currentUserData.bio;
  } else {
    document.getElementById('bioText').style.display = 'none';
  }

  if (currentUserData.profileLink) {
    document.getElementById('profileLink').textContent = currentUserData.profileLink;
    document.getElementById('profileLink').style.display = 'block';
  }

  db.ref('users/' + currentUserId).on('value', function(snap) {
    if (!snap.exists()) return;
    var data = snap.val();
    currentUserData = data;
    document.getElementById('topUsername').textContent = data.username || 'user';
    document.getElementById('displayName').textContent = data.displayName || 'User';
    if (data.avatar) document.getElementById('profileAvatar').src = data.avatar;
    if (data.bio) {
      document.getElementById('bioText').textContent = data.bio;
      document.getElementById('bioText').style.display = 'block';
    } else {
      document.getElementById('bioText').style.display = 'none';
    }
    if (data.profileLink) {
      document.getElementById('profileLink').textContent = data.profileLink;
      document.getElementById('profileLink').style.display = 'block';
    } else {
      document.getElementById('profileLink').style.display = 'none';
    }
    document.getElementById('postCount').textContent = data.postCount || 0;
    document.getElementById('followerCount').textContent = data.followerCount || 0;
    document.getElementById('followingCount').textContent = data.followingCount || 0;
  });
}

function loadUserPosts() {
  var grid = document.getElementById('profileGrid');
  grid.innerHTML = '<div class="skeleton" style="aspect-ratio:1"></div><div class="skeleton" style="aspect-ratio:1"></div><div class="skeleton" style="aspect-ratio:1"></div><div class="skeleton" style="aspect-ratio:1"></div><div class="skeleton" style="aspect-ratio:1"></div><div class="skeleton" style="aspect-ratio:1"></div>';

  db.ref('posts').orderByChild('userId').equalTo(currentUserId).on('value', function(snap) {
    var posts = snap.val();
    if (!posts) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="far fa-images"></i><p>No posts yet. Share your first photo!</p></div>';
      return;
    }
    var keys = Object.keys(posts);
    keys.reverse();
    var html = '';
    keys.forEach(function(key) {
      var post = posts[key];
      var likeCount = post.likes ? Object.keys(post.likes).length : 0;
      var isVideo = post.mediaType === 'video';
      var mediaHtml = '';
      if (isVideo) {
        mediaHtml = '<video src="' + post.mediaUrl + '" muted style="width:100%;height:100%;object-fit:cover;"></video>';
      } else {
        mediaHtml = '<img src="' + post.mediaUrl + '" alt="Post" loading="lazy">';
      }
      html += '<div class="profile-grid-item" onclick="showToast(\'Opening post...\', \'info\')">' +
        mediaHtml +
        '<div class="grid-overlay">' +
        '<span><i class="fas fa-heart"></i> ' + likeCount + '</span>' +
        '</div>' +
        '</div>';
    });
    grid.innerHTML = html;
  });
}

document.querySelectorAll('.profile-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.profile-tab').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    var tabName = this.getAttribute('data-tab');
    var grid = document.getElementById('profileGrid');
    if (tabName === 'grid') {
      loadUserPosts();
    } else if (tabName === 'reels') {
      db.ref('posts').orderByChild('userId').equalTo(currentUserId).once('value', function(snap) {
        var posts = snap.val();
        if (!posts) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-play-circle"></i><p>No reels yet</p></div>';
          return;
        }
        var videoPosts = Object.keys(posts).filter(function(k) { return posts[k].mediaType === 'video'; });
        if (videoPosts.length === 0) {
          grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-play-circle"></i><p>No reels yet</p></div>';
          return;
        }
        var html = '';
        videoPosts.reverse().forEach(function(key) {
          html += '<div class="profile-grid-item"><video src="' + posts[key].mediaUrl + '" muted style="width:100%;height:100%;object-fit:cover;"></video></div>';
        });
        grid.innerHTML = html;
      });
    } else if (tabName === 'tagged') {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i class="fas fa-user-tag"></i><p>No tagged posts</p></div>';
    }
  });
});

initUser().then(function() {
  loadProfileData();
  loadUserPosts();
});
</script>
</body>
</html>
