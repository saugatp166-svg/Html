<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>InstaGram - Wallet</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg-secondary: #111820;
    --bg-card: #151d28;
    --bg-elevated: #1a2332;
    --fg: #e8edf3;
    --fg-muted: #6b7d94;
    --fg-dim: #3d4f63;
    --accent: #00d4aa;
    --accent-glow: rgba(0, 212, 170, 0.25);
    --accent-dark: #00a885;
    --danger: #ff4757;
    --warning: #ffa502;
    --success: #2ed573;
    --border: rgba(255,255,255,0.06);
    --glass: rgba(17, 24, 32, 0.85);
    --radius: 14px;
    --radius-sm: 8px;
    --radius-full: 9999px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --shadow-accent: 0 4px 20px rgba(0, 212, 170, 0.3);
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app-shell {
    max-width: 430px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  .bg-atmosphere {
    position: fixed;
    top: 0; left: 50%;
    transform: translateX(-50%);
    max-width: 430px;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-atmosphere .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: orbFloat 12s ease-in-out infinite;
  }
  .bg-atmosphere .orb:nth-child(1) {
    width: 300px; height: 300px;
    background: var(--accent);
    top: -80px; right: -60px;
  }
  .bg-atmosphere .orb:nth-child(2) {
    width: 200px; height: 200px;
    background: #ff6b6b;
    bottom: 100px; left: -40px;
    animation-delay: -4s;
    opacity: 0.08;
  }
  .bg-atmosphere .orb:nth-child(3) {
    width: 250px; height: 250px;
    background: #ffd93d;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation-delay: -8s;
    opacity: 0.05;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(20px, -30px) scale(1.1); }
    66% { transform: translate(-15px, 20px) scale(0.95); }
  }
  .page {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 64px;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 1;
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .page::-webkit-scrollbar { display: none; }
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .top-bar .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--fg);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .top-bar .actions { display: flex; gap: 16px; }
  .top-bar .actions button {
    background: none; border: none;
    color: var(--fg); font-size: 20px;
    cursor: pointer;
    transition: var(--transition);
  }
  .top-bar .actions button:hover { color: var(--accent); }
  .bottom-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 64px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid var(--border);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--fg-dim);
    font-size: 10px;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    transition: var(--transition);
    position: relative;
    text-decoration: none;
  }
  .nav-item i { font-size: 20px; transition: var(--transition); }
  .nav-item.active { color: var(--accent); }
  .nav-item.active i { transform: scale(1.1); }
  .nav-item::before {
    content: '';
    position: absolute;
    top: -1px; left: 50%;
    transform: translateX(-50%) scaleX(0);
    width: 24px; height: 2px;
    border-radius: 2px;
    background: var(--accent);
    transition: var(--transition);
  }
  .nav-item.active::before { transform: translateX(-50%) scaleX(1); }
  .nav-item.upload-btn {
    position: relative;
    top: -10px;
  }
  .nav-item.upload-btn .upload-icon-wrap {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-accent);
    transition: var(--transition);
  }
  .nav-item.upload-btn:hover .upload-icon-wrap {
    transform: scale(1.08);
    box-shadow: 0 6px 28px rgba(0, 212, 170, 0.45);
  }
  .nav-item.upload-btn i { color: #fff; font-size: 20px; }
  .nav-item.upload-btn span { display: none; }
  .wallet-hero {
    margin: 16px 18px;
    padding: 28px 22px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, #0d2d24, #0a1f1a, #071510);
    border: 1px solid rgba(0, 212, 170, 0.15);
    position: relative;
    overflow: hidden;
  }
  .wallet-hero::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.06;
    filter: blur(40px);
  }
  .wallet-hero .label {
    font-size: 12px;
    color: var(--fg-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }
  .wallet-hero .balance {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 38px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
  }
  .wallet-hero .balance .currency { font-size: 22px; color: var(--accent); }
  .wallet-hero .change {
    font-size: 13px;
    color: var(--success);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .wallet-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    padding: 0 18px;
    margin-bottom: 24px;
  }
  .wallet-action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 8px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: var(--transition);
    color: var(--fg);
    font-family: 'Outfit', sans-serif;
  }
  .wallet-action-btn:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  .wallet-action-btn .icon-circle {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .wallet-action-btn span {
    font-size: 11px;
    font-weight: 500;
    color: var(--fg-muted);
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    margin-bottom: 14px;
  }
  .section-header h3 {
    font-size: 16px;
    font-weight: 700;
  }
  .section-header .see-all {
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'Outfit', sans-serif;
    font-weight: 500;
  }
  .tx-list { padding: 0 18px; }
  .tx-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    transition: var(--transition);
  }
  .tx-item:last-child { border-bottom: none; }
  .tx-icon {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .tx-info { flex: 1; }
  .tx-info .tx-title { font-size: 14px; font-weight: 600; }
  .tx-info .tx-date { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
  .tx-amount { font-size: 14px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
  .tx-amount.positive { color: var(--success); }
  .tx-amount.negative { color: var(--danger); }
  .toast-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    max-width: 400px;
    width: calc(100% - 36px);
  }
  .toast {
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    animation: toastIn 0.35s ease, toastOut 0.35s ease 2.5s forwards;
    box-shadow: var(--shadow);
  }
  .toast.success {
    background: #0d2818;
    border: 1px solid rgba(46, 213, 115, 0.3);
    color: var(--success);
  }
  .toast.error {
    background: #2d0f13;
    border: 1px solid rgba(255, 71, 87, 0.3);
    color: var(--danger);
  }
  .toast.info {
    background: #0d1f2d;
    border: 1px solid rgba(0, 212, 170, 0.3);
    color: var(--accent);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-20px); }
  }
  .fade-up {
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.5s ease forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .skeleton {
    background: linear-gradient(90deg, var(--bg-card) 25%, var(--bg-elevated) 50%, var(--bg-card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: var(--radius-sm);
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--fg-dim);
  }
  .empty-state i { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 14px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
  @media (min-width: 431px) {
    .app-shell {
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
  }
</style>
</head>
<body>

<div class="app-shell" id="app">
  <div class="bg-atmosphere">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="page active" id="page-wallet">
    <div class="top-bar">
      <div class="logo">Wallet</div>
      <div class="actions">
        <button aria-label="History" id="historyBtn">
          <i class="fas fa-history"></i>
        </button>
      </div>
    </div>

    <div class="wallet-hero fade-up">
      <div class="label">Total Balance</div>
      <div class="balance"><span class="currency">$</span><span id="balanceDisplay">0.00</span></div>
      <div class="change" id="changeDisplay"><i class="fas fa-arrow-up"></i> +0% this month</div>
    </div>

    <div class="wallet-actions fade-up">
      <button class="wallet-action-btn" onclick="doDeposit()">
        <div class="icon-circle" style="background:rgba(0,212,170,0.15);color:var(--accent)">
          <i class="fas fa-plus"></i>
        </div>
        <span>Deposit</span>
      </button>
      <button class="wallet-action-btn" onclick="doWithdraw()">
        <div class="icon-circle" style="background:rgba(255,165,2,0.15);color:var(--warning)">
          <i class="fas fa-arrow-up"></i>
        </div>
        <span>Withdraw</span>
      </button>
      <button class="wallet-action-btn" onclick="doTransfer()">
        <div class="icon-circle" style="background:rgba(116,125,255,0.15);color:#747dff">
          <i class="fas fa-exchange-alt"></i>
        </div>
        <span>Transfer</span>
      </button>
      <button class="wallet-action-btn" onclick="showToast('QR Code generated', 'success')">
        <div class="icon-circle" style="background:rgba(255,107,107,0.15);color:#ff6b6b">
          <i class="fas fa-qrcode"></i>
        </div>
        <span>QR Pay</span>
      </button>
    </div>

    <div class="section-header fade-up">
      <h3>Recent Transactions</h3>
      <button class="see-all" onclick="showToast('Showing all transactions', 'info')">See All</button>
    </div>
    <div class="tx-list fade-up" id="txList"></div>
  </div>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation">
    <a class="nav-item" href="home.html" aria-label="Home">
      <i class="fas fa-home"></i>
      <span>Home</span>
    </a>
    <a class="nav-item active" href="wallet.html" aria-label="Wallet">
      <i class="fas fa-wallet"></i>
      <span>Wallet</span>
    </a>
    <a class="nav-item upload-btn" href="upload.html" aria-label="Upload">
      <div class="upload-icon-wrap">
        <i class="fas fa-plus"></i>
      </div>
      <span>Upload</span>
    </a>
    <a class="nav-item" href="referral.html" aria-label="Referral">
      <i class="fas fa-gift"></i>
      <span>Invite</span>
    </a>
    <a class="nav-item" href="profile.html" aria-label="Profile">
      <i class="fas fa-user"></i>
      <span>Profile</span>
    </a>
  </nav>

  <div class="toast-container" id="toastContainer"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAmQxNPKANzO8hEng5pdpAR3t7DJtwkG7U",
  authDomain: "aibmodel.firebaseapp.com",
  databaseURL: "https://aibmodel-default-rtdb.firebaseio.com",
  projectId: "aibmodel",
  storageBucket: "aibmodel.firebasestorage.app",
  messagingSenderId: "572663832515",
  appId: "1:572663832515:web:3fea2dac685b9b5f646776"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUserId = null;

function initUser() {
  return new Promise((resolve) => {
    const stored = localStorage.getItem('instaUserId');
    if (stored) {
      currentUserId = stored;
      db.ref('users/' + currentUserId).once('value', (snap) => {
        if (snap.exists()) {
          resolve();
        } else {
          registerNewUser(resolve);
        }
      });
    } else {
      window.location.href = 'home.html';
    }
  });
}

function registerNewUser(resolve) {
  window.location.href = 'home.html';
}

function showToast(msg, type) {
  var c = document.getElementById('toastContainer');
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  var icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle';
  t.innerHTML = '<i class="fas ' + icon + '"></i>' + msg;
  c.appendChild(t);
  setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
}

function doDeposit() {
  var amount = parseFloat(prompt('Enter deposit amount:'));
  if (isNaN(amount) || amount <= 0) {
    if (amount !== null) showToast('Invalid amount', 'error');
    return;
  }
  db.ref('wallet/' + currentUserId + '/transactions').push({
    type: 'deposit',
    amount: amount,
    title: 'Deposit',
    date: Date.now()
  });
  db.ref('wallet/' + currentUserId + '/balance').transaction(function(current) {
    return (current || 0) + amount;
  });
  showToast('Deposit of $' + amount.toFixed(2) + ' successful', 'success');
}

function doWithdraw() {
  db.ref('wallet/' + currentUserId + '/balance').once('value', function(snap) {
    var bal = snap.val() || 0;
    var amount = parseFloat(prompt('Enter withdrawal amount (Balance: $' + bal.toFixed(2) + '):'));
    if (isNaN(amount) || amount <= 0) {
      if (amount !== null) showToast('Invalid amount', 'error');
      return;
    }
    if (amount > bal) {
      showToast('Insufficient balance', 'error');
      return;
    }
    db.ref('wallet/' + currentUserId + '/transactions').push({
      type: 'withdraw',
      amount: amount,
      title: 'Withdrawal',
      date: Date.now()
    });
    db.ref('wallet/' + currentUserId + '/balance').transaction(function(current) {
      return (current || 0) - amount;
    });
    showToast('Withdrawal of $' + amount.toFixed(2) + ' requested', 'info');
  });
}

function doTransfer() {
  var targetId = prompt('Enter user ID to transfer to:');
  if (!targetId) return;
  var amount = parseFloat(prompt('Enter transfer amount:'));
  if (isNaN(amount) || amount <= 0) {
    if (amount !== null) showToast('Invalid amount', 'error');
    return;
  }
  db.ref('wallet/' + currentUserId + '/balance').once('value', function(snap) {
    var bal = snap.val() || 0;
    if (amount > bal) {
      showToast('Insufficient balance', 'error');
      return;
    }
    db.ref('wallet/' + currentUserId + '/balance').transaction(function(current) {
      return (current || 0) - amount;
    });
    db.ref('wallet/' + currentUserId + '/transactions').push({
      type: 'transfer_out',
      amount: amount,
      title: 'Transfer to ' + targetId,
      date: Date.now()
    });
    db.ref('wallet/' + targetId + '/balance').transaction(function(current) {
      return (current || 0) + amount;
    });
    db.ref('wallet/' + targetId + '/transactions').push({
      type: 'transfer_in',
      amount: amount,
      title: 'Transfer from ' + currentUserId,
      date: Date.now()
    });
    showToast('Transfer of $' + amount.toFixed(2) + ' sent', 'success');
  });
}

function timeAgo(timestamp) {
  var diff = Date.now() - timestamp;
  var mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  var days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return Math.floor(days / 7) + 'w ago';
}

function loadWallet() {
  db.ref('wallet/' + currentUserId + '/balance').on('value', function(snap) {
    var bal = snap.val() || 0;
    document.getElementById('balanceDisplay').textContent = bal.toFixed(2);
  });

  db.ref('wallet/' + currentUserId + '/transactions').orderByChild('date').limitToLast(20).on('value', function(snap) {
    var txs = snap.val();
    var list = document.getElementById('txList');
    if (!txs) {
      list.innerHTML = '<div class="empty-state"><i class="fas fa-receipt"></i><p>No transactions yet</p></div>';
      return;
    }
    var keys = Object.keys(txs);
    keys.reverse();
    var html = '';
    keys.forEach(function(key) {
      var tx = txs[key];
      var isPositive = tx.type === 'deposit' || tx.type === 'transfer_in' || tx.type === 'referral_earn';
      var iconBg = isPositive ? 'rgba(46,213,115,0.15)' : 'rgba(255,71,87,0.15)';
      var iconColor = isPositive ? 'var(--success)' : 'var(--danger)';
      var iconClass = 'fas fa-arrow-down';
      if (tx.type === 'withdraw') iconClass = 'fas fa-arrow-up';
      if (tx.type === 'transfer_out') iconClass = 'fas fa-arrow-right';
      if (tx.type === 'transfer_in') iconClass = 'fas fa-arrow-left';
      if (tx.type === 'referral_earn') iconClass = 'fas fa-gift';

      html += '<div class="tx-item">' +
        '<div class="tx-icon" style="background:' + iconBg + ';color:' + iconColor + '"><i class="' + iconClass + '"></i></div>' +
        '<div class="tx-info">' +
        '<div class="tx-title">' + tx.title + '</div>' +
        '<div class="tx-date">' + timeAgo(tx.date) + '</div>' +
        '</div>' +
        '<div class="tx-amount ' + (isPositive ? 'positive' : 'negative') + '">' +
        (isPositive ? '+' : '-') + '$' + tx.amount.toFixed(2) +
        '</div>' +
        '</div>';
    });
    list.innerHTML = html;
  });
}

document.getElementById('historyBtn').addEventListener('click', function() {
  showToast('Full transaction history', 'info');
});

initUser().then(function() {
  loadWallet();
});
</script>
</body>
</html>
